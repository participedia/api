<div class="languages-sel">
  <div id="google_translate_element"></div>
</div>

<script type="text/javascript">
function googleTranslateElementInit() {
  new google.translate.TranslateElement({pageLanguage: 'en'}, 'google_translate_element');
}
</script>

<script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

<script 
  type="text/template" 
  class="js-language-select-modal-content"
  data-header="{{t 'faq_q14'}}"
>
  <p>{{t "faq_a14_p1"}}</p>
  <p>{{t "faq_a14_p2"}}</p>
  <p>{{t "faq_a14_p3"}}</p>
  <p>{{t "faq_a14_p4"}}</p>
</script>

<script type="text/template" class="js-language-select-tooltip-template">
  <div>
    {{{__
      "new-entry-language-select-tooltip__text"
      "<strong>"
      (getLocalizedLanguageLabel)
      "</strong>"
    }}}
  </div>
  <div class="language-select-tooltip__actions">
    <a href="#" class="js-language-select-tooltip__more-link">{{t "Tell me more..."}}</a>
    <a href="#" class="js-language-select-tooltip__got-it-link">{{t "Got it"}}</a>
  </div>
</script>
