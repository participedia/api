<div class="language-selector js-language-selector">
  <label class="selected-language">{{getLocale}}</label>
  <select
    name="locale"
    class="language-select js-language-select"
    data-app-locales="{{getAppLocaleCodesCsv}}"
  >
    {{#if showTwoLetterCode}}
    {{else}}
      <option value="">{{t "Select Language"}}</option>
    {{/if}}
    {{#each (getLanguageOptions)}}
      {{#if ../showBoth}}
        {{> language-select-option key=twoLetterCode showBoth=../showBoth isAppLocale=isAppLocale value=(getLanguageOptionValue this)}}
      {{else}}
        {{#if ../showTwoLetterCode}}
          {{> language-select-option key=twoLetterCode showBoth=../showBoth isAppLocale=isAppLocale value=(toUpperCase twoLetterCode)}}
        {{else}}
          {{> language-select-option key=twoLetterCode showBoth=../showBoth isAppLocale=isAppLocale value=(getLanguageOptionValue this)}}
        {{/if}}
      {{/if}}
    {{/each}}
  </select>
</div>

<div class="js-google-translate-element" style="display:none;" aria-hidden="true"></div>

<script 
  type="text/template" 
  class="js-language-select-modal-content"
  data-header="{{t 'faq_q14'}}"
>
  <p>{{t "faq_a14_p1"}}</p>
  <p>{{t "faq_a14_p2"}}</p>
  <p>{{t "faq_a14_p3"}}</p>
  <p>{{t "faq_a14_p4"}}</p>
</script>

<script type="text/template" class="js-language-select-tooltip-template">
  <div>
    {{{__
      "new-entry-language-select-tooltip__text"
      "<strong>"
      (getLocalizedLanguageLabel)
      "</strong>"
    }}}
  </div>
  <div class="language-select-tooltip__actions">
    <a href="#" class="js-language-select-tooltip__more-link">{{t "Tell me more..."}}</a>
    <a href="#" class="js-language-select-tooltip__got-it-link">{{t "Got it"}}</a>
  </div>
</script>
